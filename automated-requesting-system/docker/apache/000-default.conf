<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/automated-requesting-system/public

    <Directory /var/www/automated-requesting-system/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>