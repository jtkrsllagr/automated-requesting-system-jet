<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/automated-requesting-system/public

    SSLEngine on
    SSLCertificateFile /etc/ars-certs/ars-selfsigned.crt
    SSLCertificateKeyFile /etc/ars-certs/ars-selfsigned.key

    <Directory /var/www/automated-requesting-system/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ars_error.log
    CustomLog ${APACHE_LOG_DIR}/ars_access.log combined
</VirtualHost>
</IfModule>